name: Refresh screenshots
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      apps:
        description: Space-separated app slugs to capture (empty captures all)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: screenshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture live apps
        continue-on-error: true
        env:
          SHOT_SETTLE_MS: '9000'
        run: npm run shots -- ${{ inputs.apps }}
      - name: Render social preview
        run: |
          npm run build
          node scripts/serve.mjs &
          for i in $(seq 1 20); do curl -fs http://localhost:4173/UnoSpace/ >/dev/null && break; sleep 0.5; done
          npm run og
      - name: Commit refreshed images
        run: |
          if git diff --quiet -- site/static; then echo "No visual changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/static
          git commit -m "Refresh live app screenshots"
          git push
